[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqspec"
version = "0.1.0"
description = "YAML-declared data contracts, validated against Spark or pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Matthew Currier" }]

# Deliberately minimal. pyspark/pandas are NOT dependencies -- the validator
# duck-types whatever frame it is handed, so installing this on a Databricks
# cluster will never try to reinstall or shadow the runtime's pyspark.
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pandas>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ships the contract YAML inside the wheel. Without this, the
# "%pip install" and wheel delivery paths would install code but no contracts.
dqspec = ["contracts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
